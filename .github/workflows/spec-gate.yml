#   spec-gate — 実装着手ゲートの CI 裏取り（再利用可能ワークフロー / workflow_call）
#
#   commit-msg フック（L1）は --no-verify で回避できるため、回避不能な L2 として
#   同じ spec-lint を CI で走らせる。ロジックは harness 側に集約し、各プロジェクトは
#   薄い呼び出しスタブから uses: で参照する（本 harness は PUBLIC なので別オーナーの
#   private リポジトリからも呼べる）。uses: の ref と harness_ref は同じ値にする:
#
#     # <project>/.github/workflows/spec-gate.yml
#     name: spec-gate
#     on: { pull_request: , push: { branches: [main] } }
#     jobs:
#       spec-gate:
#         uses: tsay-dev/harness/.github/workflows/spec-gate.yml@vX.Y.Z
#         with: { harness_ref: vX.Y.Z }
#
#   PR ではブランチ名とコミットメッセージの書式（tools/git-lint）も同じジョブで検査する。
#   ホストが traceconfig.json に git を宣言したときだけ実行され、未宣言なら「検査していない」と出て通る。
#   失敗で merge を止めるには、ホストが既定ブランチの保護でこのジョブを必須チェックにする。
#
#   検査ツールは、harness_ref の tsay-dev/harness を $RUNNER_TEMP/harness に checkout して使う。
#   利用者の .harness は使わない（PR で書き換えた検査器を CI が実行しないため。ADR-0057）。
#   harness_path（既定 .harness）は、利用者の .harness の HEAD が harness_ref と違うときに警告するためだけに読む。
#   呼び出し側のワークフロー自体も PR で書き換えられるので、.github/workflows/** は CODEOWNERS などで必須レビューにする。
#
#   monorepo（traceconfig.json の git.units）では、spec-lint / trace-check を unit ごとに
#   <dir>/traceconfig.json と <dir>/docs で実行する（stop-gate と同じ規則）。
#   PR では、この PR で変わった traceconfig.json・status / x-status の行・workflow をジョブ要約に出す（止めない）。
name: spec-gate

on:
  workflow_call:
    inputs:
      #   検査に使う tsay-dev/harness の ref（タグか SHA）。uses: の @ref と同じ値にする
      harness_ref:
        type: string
        required: true
      #   利用者の harness の置き場。harness_ref との食い違いの警告だけに使う（検査には使わない）
      harness_path:
        type: string
        required: false
        default: ".harness"
      #   移行中（docs/specs/ が残る間）は "--ignore-legacy-layout" を渡す。移行完了時に外す（docs-migrate Phase 7）
      spec_lint_args:
        type: string
        required: false
        default: ""

jobs:
  spec-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      #   actions/checkout は作業ディレクトリの外へ置けないので、いったん置いてから $RUNNER_TEMP へ移す
      #   （利用者のツリーに検査器を残さない）
      - name: Checkout harness (harness_ref)
        uses: actions/checkout@v4
        with:
          repository: tsay-dev/harness
          ref: ${{ inputs.harness_ref }}
          path: .spec-gate-harness
          persist-credentials: false

      - name: Place harness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/harness"
          mv .spec-gate-harness "$RUNNER_TEMP/harness"
          echo "HARNESS_ROOT=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"

      #   利用者の .harness が harness_ref と違えば、ローカルの hook と CI が別の検査器を使っている
      - name: Compare local harness with harness_ref
        shell: bash
        env:
          HARNESS_PATH: ${{ inputs.harness_path }}
          HARNESS_REF: ${{ inputs.harness_ref }}
        run: |
          set -uo pipefail
          ci=$(git -C "$HARNESS_ROOT" rev-parse HEAD)
          if [ ! -e "$HARNESS_PATH" ]; then echo "harness_path ($HARNESS_PATH) が無い: 比較しない"; exit 0; fi
          #   .harness が独立した checkout（submodule 等）でなければ、rev-parse は利用者のリポジトリの HEAD を返してしまう
          top=$(git -C "$HARNESS_PATH" rev-parse --show-toplevel 2>/dev/null || true)
          local_head=""
          if [ -n "$top" ] && [ "$(cd "$HARNESS_PATH" && pwd -P)" = "$(cd "$top" && pwd -P)" ]; then
            local_head=$(git -C "$HARNESS_PATH" rev-parse HEAD 2>/dev/null || true)
          fi
          if [ -z "$local_head" ]; then
            echo "::warning::harness_path ($HARNESS_PATH) が git の checkout でなく、HEAD を比べられない。CI は harness_ref ($HARNESS_REF = $ci) で検査する"
          elif [ "$local_head" != "$ci" ]; then
            echo "::warning::利用者の $HARNESS_PATH ($local_head) が harness_ref ($HARNESS_REF = $ci) と違う。ローカルの hook と CI が別の検査器を使っている。uses: の ref・harness_ref・$HARNESS_PATH をそろえる"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      #   git.units を「名前<TAB>ディレクトリ」の行で書き出す（無ければ空。traceconfig.json が JSON として読めなければ落とす）
      - name: Read units
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");if(!fs.existsSync("traceconfig.json"))process.exit(0);const u=(JSON.parse(fs.readFileSync("traceconfig.json","utf8")).git||{}).units;if(u&&typeof u==="object"&&!Array.isArray(u))for(const [k,v] of Object.entries(u)){if(typeof v!=="string"||!v.trim()){console.error(`git.units.${k} がディレクトリの文字列でない`);process.exit(1)}console.log(k+"\t"+v)}' > "$RUNNER_TEMP/units.tsv"
          if [ -s "$RUNNER_TEMP/units.tsv" ]; then echo "monorepo:"; cat "$RUNNER_TEMP/units.tsv"; fi

      #   docs SSOT のフォーマット / ライフサイクル（契約カバレッジ warn 含む）。baseline は無く、違反はすべて落とす（ADR-0056）
      #   monorepo では unit ごと。docs も traceconfig も持たない unit は「docs なし」、docs を持つのに traceconfig が無い unit は失敗
      - name: Validate docs SSOT
        shell: bash
        env:
          SPEC_LINT_ARGS: ${{ inputs.spec_lint_args }}
        run: |
          set -uo pipefail
          if [ ! -s "$RUNNER_TEMP/units.tsv" ]; then
            node "$HARNESS_ROOT/tools/spec-lint/spec-lint.mjs" validate $SPEC_LINT_ARGS
            exit $?
          fi
          rc=0
          while IFS=$'\t' read -r name dir; do
            if [ -f "$dir/traceconfig.json" ]; then
              echo "== unit $name ($dir)"
              node "$HARNESS_ROOT/tools/spec-lint/spec-lint.mjs" validate --docs "$dir/docs" $SPEC_LINT_ARGS < /dev/null || rc=1
            elif [ -d "$dir/docs" ]; then
              echo "::error::unit $name ($dir) は docs を持つのに $dir/traceconfig.json が無い（紐づきの検査は省略できない。ADR-0056）"; rc=1
            else
              echo "unit $name ($dir): docs なし"
            fi
          done < "$RUNNER_TEMP/units.tsv"
          exit $rc

      #   トレーサビリティ（被覆・@covers/@implements/@operation・配置・参照先の実在）。traceconfig.json が無ければ
      #   設定エラーで落ちる（紐づきの検査は省略できない。対象が無い範囲は traceconfig.json に none で宣言する / ADR-0056）
      - name: Trace check
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -s "$RUNNER_TEMP/units.tsv" ]; then
            node "$HARNESS_ROOT/tools/trace-check/trace-check.mjs"
            exit $?
          fi
          rc=0
          while IFS=$'\t' read -r name dir; do
            if [ -f "$dir/traceconfig.json" ]; then
              echo "== unit $name ($dir)"
              node "$HARNESS_ROOT/tools/trace-check/trace-check.mjs" --root "$dir" --config "$dir/traceconfig.json" < /dev/null || rc=1
            elif [ -d "$dir/docs" ]; then
              echo "::error::unit $name ($dir) は docs を持つのに $dir/traceconfig.json が無い（紐づきの検査は省略できない。ADR-0056）"; rc=1
            else
              echo "unit $name ($dir): docs なし"
            fi
          done < "$RUNNER_TEMP/units.tsv"
          exit $rc

      #   PR の各コミットの UC: トレーラを検査（UC / REQ が active でない・契約が無い/未 fixed なら落とす）
      #   モノレポ（git.units）では、コミットの scope が指す unit の docs で UC を引く（ADR-0040）
      #   push 単発では base が不定なため PR のみ（validate は常時走る）
      - name: Gate commits (UC トレーラの UC active・契約 fixed を要求)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          for sha in $(git rev-list "$base".."$head"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg.txt"
            node "$HARNESS_ROOT/tools/spec-lint/spec-lint.mjs" gate --message "$RUNNER_TEMP/msg.txt"
          done

      #   ブランチ名とコミットメッセージの書式（commit.md の機械で決まる部分。ADR-0039）
      #   head_ref は PR 作成者が決める文字列なので、run へ直接展開せず env 経由で渡す
      #   片方が落ちても両方の結果を出してから落とす
      - name: Git lint (ブランチ名・コミットメッセージの書式)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          if [ ! -f traceconfig.json ]; then echo "traceconfig.json なし: git-lint をスキップ"; exit 0; fi
          rc=0
          node "$HARNESS_ROOT/tools/git-lint/git-lint.mjs" branch --name "$HEAD_REF" || rc=1
          node "$HARNESS_ROOT/tools/git-lint/git-lint.mjs" message --range "$BASE_SHA..$HEAD_SHA" --branch "$HEAD_REF" || rc=1
          exit $rc

      #   検査の範囲と承認状態の変更を人の目に入れる（止めない）。gate-hook の ask は Claude Code の Write / Edit にしか
      #   効かないので、Bash や他のプロバイダーでの変更もここでレビューに出す（ADR-0057）
      - name: Summarize gate-relevant changes
        if: ${{ always() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          range="$BASE_SHA...$HEAD_SHA"
          {
            echo "## spec-gate: この PR で変わった検査の範囲と承認状態"
            echo
            echo "### traceconfig.json"
            d=$(git diff --no-color "$range" -- ':(glob)**/traceconfig.json' || true)
            if [ -n "$d" ]; then printf '```diff\n%s\n```\n' "$d"; else echo "変更なし"; fi
            echo
            echo "### docs の status / 契約の x-status"
            d=$(git diff --no-color -U0 "$range" -- ':(glob)**/docs/**' | awk '
              /^diff --git / { file = ""; hdr = 1; next }
              hdr && /^--- a\// { file = substr($0, 7) }
              hdr && /^\+\+\+ b\// { file = substr($0, 7) }
              /^@@/ { hdr = 0; next }
              hdr { next }
              /^[-+]status:/ && file ~ /\.md$/ { print file ": " $0; next }
              /^[-+]x-status:/ && file ~ /\.ya?ml$/ { print file ": " $0 }
            ' || true)
            if [ -n "$d" ]; then printf '```\n%s\n```\n' "$d"; else echo "変更なし"; fi
            echo
            echo "### .github/workflows"
            d=$(git diff --no-color --name-status "$range" -- .github/workflows/ || true)
            if [ -n "$d" ]; then printf '```\n%s\n```\n' "$d"; else echo "変更なし"; fi
          } >> "$GITHUB_STEP_SUMMARY"
