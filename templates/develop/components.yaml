# docs/_shared/components.yaml — 契約の共有語彙（$ref の参照先）
# ここに置けるもの: 二つ以上の UC が使うものだけ（認証方式、エラーコード、共有 DTO）
# 一 UC だけが使うスキーマはその契約内に書く（インライン、またはその UC の二つ以上の操作で
# 共有する場合は契約自身の最上位 schemas:）。ここに置いてはならない
# ここに書くのは orchestrator のみ。並行する作成者は追記してはならず、追加してほしい語彙を報告する
# 受理する YAML は contract.yaml と同じ厳格な部分集合（anchors/aliases、block scalars なし）

# 契約の `auth:` が参照する認証方式。未定義の方式を指定する操作はエラー
# 既定で有効なものはない。harness は利用プロジェクトの認証方法を決めてはならない（CLAUDE.md §0）
# このプロジェクトで実際に使うものを有効にする。複数併用してよい
authSchemes: {}
  # session:                 # web: cookie セッション
  #   kind: cookie
  #   name: session
  # bearer:                  # native / SPA: Authorization ヘッダーのトークン
  #   kind: token
  #   scheme: Bearer
  #   storage: keychain      # トークンの保管場所（keychain / secure-store / memory）。ネイティブでは明示必須
  # apiKey:
  #   kind: header
  #   name: X-Api-Key

# 契約の `errors[].code` の閉じた語彙。未定義コードはエラー
# 値はコードの意味を一行で説明する（発生条件は契約の `when:` に置く）
# trace-check C7 は実装のエラーコードがこれらのキーの部分集合か検査する（traceconfig.json の `contract` 設定時）
# 既定で定義するコードはない。契約の errors[] が実際に使うものだけを足す（使われないコードは C24 の違反）
errorCodes: {}
  # INVALID_INPUT: 入力が要件を満たさない
  # FORBIDDEN: 権限がない
  # NOT_FOUND: 対象が存在しない
  # PERMISSION_DENIED: OS の権限が拒否されている   # requires: を宣言する操作で使う

# 二つ以上の UC が使う共有 DTO
# $ref の参照先（docs/goals/<GOAL>/<UC>/contract.yaml から）: ../../../_shared/components.yaml#/schemas/<Name>
schemas: {}
